name: diversion data-integrity tests
on:
  push:
    branches:
      - foundry/observation-integrity-20261110
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/*.csv'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/*.csv'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standard-library integrity tests
        run: python -m unittest discover -s tests -v
